<h1>Liste des modèles</h1>

<!-- Message de chargement -->
<div *ngIf="loading">Chargement en cours...</div>

<!-- Message d'erreur -->
<div *ngIf="error" style="color: red;">
  Erreur lors du chargement : {{ error }}
</div>

<!-- <pre *ngIf="rawResponse" class="debug-response">{{ rawResponse }}</pre> -->



<!-- Tableau des templates -->
<table *ngIf="!loading && !error && templates.length > 0" class="table">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Description</th>
      <th>Statut</th>
      <th>Date de modification</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let template of templates">
      <td>{{ template.nom }}</td>
      <td>{{ template.description }}</td>
      <td><span class="badge" [ngClass]="template.statut">{{ template.statut }}</span></td>
      <td>{{ template.dateModification | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>
        <button [routerLink]="['/templates', template.id]" class="btn btn-primary">Détail</button>
      </td>
    </tr>
  </tbody>
</table>

<!-- Message si aucun template -->
<p *ngIf="!loading && !error && templates.length === 0" class="message">
  Aucun modèle pour le moment.
</p>
