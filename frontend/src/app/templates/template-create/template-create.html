<h1>Créer un nouveau modèle</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
  <div class="form-group">
    <label for="nom">Nom *</label>
    <input id="nom" type="text" formControlName="nom" class="form-control" />
    <div class="error" *ngIf="form.get('nom')?.invalid && form.get('nom')?.touched">
      Le nom est obligatoire.
    </div>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <input id="description" type="text" formControlName="description" class="form-control" />
  </div>

  <!-- Nouveau champ : Design JSON -->
  <div class="form-group">
    <label for="contenuDesign">Design JSON (optionnel)</label>
    <textarea id="contenuDesign" formControlName="contenuDesign" class="form-control" rows="6"></textarea>
    <div class="error" *ngIf="form.get('contenuDesign')?.invalid && form.get('contenuDesign')?.touched">
      Le design doit être un JSON valide.
    </div>
  </div>

  <button type="submit" [disabled]="form.invalid || submitting" class="btn btn-primary">
    {{ submitting ? 'Création...' : 'Créer' }}
  </button>

  <div *ngIf="error" class="error message">{{ error }}</div>
</form>
