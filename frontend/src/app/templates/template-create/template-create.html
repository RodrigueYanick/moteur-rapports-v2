<h1>Créer un nouveau modèle</h1>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
  <div class="form-group">
    <label for="nom">Nom *</label>
    <input id="nom" type="text" formControlName="nom" class="form-control" />
    <div class="error" *ngIf="form.get('nom')?.invalid && form.get('nom')?.touched">
      Le nom est obligatoire.
    </div>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <input id="description" type="text" formControlName="description" class="form-control" />
  </div>

  <div class="form-group">
    <label for="codeEntreprise">Code entreprise</label>
    <input id="codeEntreprise" type="text" formControlName="codeEntreprise" class="form-control" />
  </div>

  <div class="form-group">
    <label for="categorie">Catégorie</label>
    <select id="categorie" formControlName="categorie" class="form-control">
      <option value="VENTES">Ventes</option>
      <option value="ACHATS">Achats</option>
      <option value="FINANCE">Finance</option>
      <option value="RH">Ressources Humaines</option>
      <option value="LOGISTIQUE">Logistique</option>
      <option value="STOCK">Stock</option>
      <option value="PRODUCTION">Production</option>
      <option value="ADMINISTRATION">Administration</option>
      <option value="AUTRES">Autres</option>
    </select>
  </div>

  <div class="form-group">
    <label for="formatPapier">Format papier</label>
    <select id="formatPapier" formControlName="formatPapier" class="form-control">
      <option value="A4">A4</option>
      <option value="A5">A5</option>
      <option value="Letter">Letter</option>
      <option value="Legal">Legal</option>
    </select>
  </div>

  <!-- <app-report-designer [(blocks)]="blocks" (blocksChange)="saveDesign()"></app-report-designer> -->

  <button type="submit" [disabled]="form.invalid || submitting" class="btn btn-primary">
    {{ submitting ? 'Création...' : 'Créer' }}
  </button>

  <div *ngIf="error" class="error message">{{ error }}</div>
</form>
