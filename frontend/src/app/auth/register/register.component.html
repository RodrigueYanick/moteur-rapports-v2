<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-circle">
        <lucide-icon [img]="icons.userPlus" [size]="28"></lucide-icon>
      </div>
      <h1>Créer un compte</h1>
      <p class="subtitle">Enregistrez votre entreprise et commencez à générer vos rapports</p>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="prenom">Prénom</label>
          <div class="input-wrapper">
            <lucide-icon [img]="icons.user" [size]="18" class="input-icon"></lucide-icon>
            <input id="prenom" type="text" [(ngModel)]="prenom" name="prenom" placeholder="Sophie" />
          </div>
        </div>

        <div class="form-group">
          <label for="nom">Nom *</label>
          <div class="input-wrapper">
            <input id="nom" type="text" [(ngModel)]="nom" name="nom" placeholder="Martin" required />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Adresse email *</label>
        <div class="input-wrapper">
          <lucide-icon [img]="icons.mail" [size]="18" class="input-icon"></lucide-icon>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="sophie.martin@entreprise.com"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe *</label>
        <div class="input-wrapper">
          <lucide-icon [img]="icons.lock" [size]="18" class="input-icon"></lucide-icon>
          <input
            id="password"
            type="password"
            [(ngModel)]="motDePasse"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="new-password"
          />
        </div>
      </div>

      <div class="form-divider">
        <span>Informations Entreprise</span>
      </div>

      <div class="form-group">
        <label for="nomEntreprise">Nom de l'entreprise</label>
        <div class="input-wrapper">
          <lucide-icon [img]="icons.building" [size]="18" class="input-icon"></lucide-icon>
          <input
            id="nomEntreprise"
            type="text"
            [(ngModel)]="nomEntreprise"
            name="nomEntreprise"
            placeholder="Ex: Acme Corporation"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="codeEntreprise">Code Entreprise (Optionnel)</label>
        <div class="input-wrapper">
          <input
            id="codeEntreprise"
            type="text"
            [(ngModel)]="codeEntreprise"
            name="codeEntreprise"
            placeholder="Ex: ACME (ou généré automatiquement)"
            style="text-transform: uppercase;"
          />
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading">
        <span *ngIf="!loading">Créer mon compte</span>
        <span *ngIf="loading">Création en cours...</span>
        <lucide-icon *ngIf="!loading" [img]="icons.arrowRight" [size]="18"></lucide-icon>
      </button>
    </form>

    <div class="auth-footer">
      <span>Vous avez déjà un compte ?</span>
      <a routerLink="/auth/login">Se connecter</a>
    </div>
  </div>
</div>
