<div class="designer-layout">
  <app-designer-toolbar
    [templateName]="templateName"
    [templateStatus]="templateStatus"
    [savingStatus]="savingStatus"
    [canCopy]="canCopy"
    [canPaste]="canPaste"
    [selectedBlockIds]="selectedBlockIds"
    [showGrid]="showGrid"
    [snapEnabled]="snapEnabled"
    [showGuides]="showGuides"
    [zoomPercent]="zoomPercent"
    [formatPapier]="formatPapier"
    [effectiveMargeHautMm]="effectiveMargeHautMm"
    [isLocked]="isLocked"
    [fillingMode]="fillingMode"
    (undo)="undo()"
    (redo)="redo()"
    (copyBlock)="copySelectedBlock()"
    (pasteBlock)="pasteBlock()"
    (duplicateBlock)="duplicateSelectedBlock()"
    (deleteBlock)="deleteSelectedBlock()"
    (alignBlocks)="alignSelectedBlocks($event)"
    (distributeBlocks)="distributeSelectedBlocks($event)"
    (toggleGrid)="toggleGrid()"
    (toggleSnap)="toggleSnap()"
    (toggleGuides)="toggleGuides()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (openSettings)="openPageSettings()"
    (requestDuplicate)="requestDuplicate()"
    (toggleFilling)="toggleFillingMode()"
    (startTour)="startOnboarding()"
    (preview)="preview()"
    (exportPdf)="exportPdf()"
    (exportHtml)="exportHtml()"
    (save)="manualSave()"
    (publish)="publish()"
  ></app-designer-toolbar>

  <ng-template #fillingPanel>
    <app-template-filler
      [templateId]="templateId"  
      [selectedBlock]="selectedBlock"
      (generatePdfRequest)="onFillerGenerate($event)"
    >
    </app-template-filler>
  </ng-template>

  <app-designer-page-tabs
    [pages]="pages"
    [activePageIndex]="activePageIndex"
    [isAutoPagination]="isAutoPagination"
    [isLocked]="isLocked"
    (pageSelect)="switchPage($event)"
    (pageAdd)="addPage()"
    (pageRemove)="onPageRemove($event)"
    (pageDuplicate)="onPageDuplicate($event)"
    (pageRename)="finishRenamePage()"
    (lockedAction)="showLockedMessage()"
  ></app-designer-page-tabs>

  <div class="main-area">
    <div class="left-panel">
      <app-sidebar
        [blocks]="blocks"
        [templateId]="templateId"
        (explicitVariablesChange)="onExplicitVariablesChanged($event)"
        [selectedBlock]="selectedBlock"
        [locked]="isLocked"
        (lockedInteraction)="showLockedMessage()"
        (blockSelected)="selectBlock($event)"
        (toggleVisibility)="onToggleVisibility($event)"
        (toggleLock)="onToggleLock($event)"
        (addBlock)="addBlock($event)"
        (insertVariable)="insertVariableBlock($event)"
        (blocksReordered)="onLayersReordered($event)">
      </app-sidebar>
    </div>

    <div class="canvas-container">
      <app-design-canvas
        [blocks]="blocks"
        [zoom]="zoomPercent"
        [canvasWidth]="canvasWidth"
        [canvasHeight]="virtualCanvasHeight"
        [showGrid]="showGrid"
        [snapEnabled]="snapEnabled"
        [showGuides]="showGuides"
        [locked]="isLocked"
        [margeHautPx]="margeHautPx"
        [margeBasPx]="margeBasPx"
        [margeGauchePx]="margeGauchePx"
        [margeDroitePx]="margeDroitePx"
        [couleurFond]="couleurFond"
        [headerActif]="headerActif"
        [hauteurHeaderMm]="hauteurHeaderMm"
        [headerContenu]="headerContenu"
        [headerAlignement]="headerAlignement"
        [headerLigneSeparation]="headerLigneSeparation"
        [headerCouleurLigne]="headerCouleurLigne"
        [footerActif]="footerActif"
        [hauteurFooterMm]="hauteurFooterMm"
        [footerContenu]="footerContenu"
        [footerAlignement]="footerAlignement"
        [footerLigneSeparation]="footerLigneSeparation"
        [footerCouleurLigne]="footerCouleurLigne"
        [selectedBlockIds]="selectedBlockIds"
        [explicitVariables]="explicitVariables"
        (lockedInteraction)="showLockedMessage()"
        (blocksPreviewChange)="onCanvasPreviewChange($event)"
        (blocksChange)="onCanvasBlocksChange($event)"
        (blockSelected)="onCanvasBlockSelected($event)"
        (selectionChange)="onCanvasSelectionChange($event)">
      </app-design-canvas>
    </div>

    <div class="right-panel">
      <ng-container *ngIf="!fillingMode; else fillingPanel">
        <app-block-editor
          *ngIf="selectedBlock"
          [block]="selectedBlock"
          [allBlocks]="allBlocksFlat"
          [explicitVariables]="explicitVariables"
          [margeGauchePx]="margeGauchePx"
          [margeHautPx]="margeHautPx"
          [margeDroitePx]="margeDroitePx"
          [margeBasPx]="margeBasPx"
          [canvasWidth]="canvasWidth"
          [canvasHeight]="canvasHeight"
          (updated)="updateBlock($event)"
          (closed)="selectedBlock = null">
        </app-block-editor>
        <app-block-preview
          [pages]="pages"
          [canvasWidth]="canvasWidth"
          [canvasHeight]="canvasHeight"
          [modePagination]="modePagination"
          [templateId]="templateId"
          [margeHautPx]="margeHautPx"
          [margeBasPx]="margeBasPx"
          [margeGauchePx]="margeGauchePx"
          [margeDroitePx]="margeDroitePx"
          [couleurFond]="couleurFond"
          [headerActif]="headerActif"
          [hauteurHeaderMm]="hauteurHeaderMm"
          [headerContenu]="headerContenu"
          [headerAlignement]="headerAlignement"
          [headerAfficherSurPremierePage]="headerAfficherSurPremierePage"
          [headerLigneSeparation]="headerLigneSeparation"
          [headerCouleurLigne]="headerCouleurLigne"
          [footerActif]="footerActif"
          [hauteurFooterMm]="hauteurFooterMm"
          [footerContenu]="footerContenu"
          [footerAlignement]="footerAlignement"
          [footerAfficherSurPremierePage]="footerAfficherSurPremierePage"
          [footerLigneSeparation]="footerLigneSeparation"
          [footerCouleurLigne]="footerCouleurLigne"
          [numerotationPage]="numerotationPage"
          [formatNumerotation]="formatNumerotation">
          [margeDroitePx]="margeDroitePx">
        </app-block-preview>
      </ng-container>
      <ng-template #fillingPanel>
        <app-template-filler [templateId]="templateId"></app-template-filler>
      </ng-template>
    </div>
  </div>

  <div class="status-bar">
    <span class="status-item">
      <lucide-icon [img]="icons.Ruler" [size]="12"></lucide-icon>
      {{ paperFormat }}
    </span>
    <span class="status-sep">|</span>
    <span class="status-item">{{ statusDimensions }}</span>
    <span class="status-sep">|</span>
    <span class="status-item">{{ statusPosition }}</span>
    <span class="status-sep">|</span>
    <span class="status-item">Zoom {{ zoomPercent }}%</span>
    <span class="status-spacer"></span>
    <span
      class="status-item save-indicator"
      [class.saving]="savingStatus === 'saving'"
      [class.saved]="savingStatus === 'saved'"
    >
      <lucide-icon
        [img]="savingStatus === 'saving' ? icons.loader : icons.check"
        [size]="12"
        [class.spin]="savingStatus === 'saving'"
      ></lucide-icon>
      {{ savingStatus === 'saving' ? 'Enregistrement...' : 'Enregistré' }}
    </span>
  </div>
</div>
<div class="locked-toast" *ngIf="lockedMessage">
  <lucide-icon [img]="icons.lock" [size]="16"></lucide-icon>
  {{ lockedMessage }}
  <button (click)="requestDuplicate()">Dupliquer</button>
</div>

<!-- Modal Paramètres de mise en page -->
<div class="modal-overlay" *ngIf="showPageSettingsModal" (click)="closePageSettings()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Paramètres de mise en page</h3>
      <button class="icon-btn" (click)="closePageSettings()">
        <lucide-icon [img]="icons.close" [size]="16"></lucide-icon>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Format Papier</label>
        <select [(ngModel)]="editingSettings.formatPapier" [disabled]="isLocked">
          <option value="A4">A4 (210 × 297 mm)</option>
          <option value="A3">A3 (297 × 420 mm)</option>
          <option value="A5">A5 (148 × 210 mm)</option>
          <option value="Letter">Letter (216 × 279 mm)</option>
          <option value="Legal">Legal (216 × 356 mm)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Mode de Pagination</label>
        <select [(ngModel)]="editingSettings.modePagination" [disabled]="isLocked">
          <option value="FIXED">Fixe (Multi-pages)</option>
          <option value="AUTO">Automatique (Flux continu)</option>
        </select>
      </div>
      <h4 style="margin: 12px 0 8px; font-size: 13px; color: #9498a8;">Marges du document (mm)</h4>
      <div class="margins-grid">
        <div class="form-group">
          <label>Haut (mm)</label>
          <input type="number" min="0" max="100" [(ngModel)]="editingSettings.margeHautMm" [disabled]="isLocked" />
        </div>
        <div class="form-group">
          <label>Bas (mm)</label>
          <input type="number" min="0" max="100" [(ngModel)]="editingSettings.margeBasMm" [disabled]="isLocked" />
        </div>
        <div class="form-group">
          <label>Gauche (mm)</label>
          <input type="number" min="0" max="100" [(ngModel)]="editingSettings.margeGaucheMm" [disabled]="isLocked" />
        </div>
        <div class="form-group">
          <label>Droite (mm)</label>
          <input type="number" min="0" max="100" [(ngModel)]="editingSettings.margeDroiteMm" [disabled]="isLocked" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="secondary-btn" (click)="closePageSettings()">Annuler</button>
      <button class="primary-btn" *ngIf="!isLocked" (click)="savePageSettings()">Appliquer</button>
    </div>
  </div>
</div>

<app-onboarding-tour></app-onboarding-tour>
