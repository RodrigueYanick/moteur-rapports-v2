<div class="designer-layout">
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="brand-mark">
        <lucide-icon [img]="icons.file" [size]="18"></lucide-icon>
      </div>
      <div class="template-info">
        <span class="template-name">{{ templateName || 'Sans titre' }}</span>
        <span class="save-status saved" *ngIf="savingStatus === 'saved'">
          <lucide-icon [img]="icons.check" [size]="12"></lucide-icon>
          Enregistré
        </span>
        <span class="save-status saving" *ngIf="savingStatus === 'saving'">
          <lucide-icon [img]="icons.loader" [size]="12" class="spin"></lucide-icon>
          Enregistrement...
        </span>
      </div>
    </div>

    <div class="toolbar-center">
      <div class="tool-group">
        <button class="icon-btn" (click)="undo()" title="Annuler">
          <lucide-icon [img]="icons.undo" [size]="18"></lucide-icon>
        </button>
        <button class="icon-btn" (click)="redo()" title="Rétablir">
          <lucide-icon [img]="icons.redo" [size]="18"></lucide-icon>
        </button>
      </div>

      <div class="tool-group">
        <button class="icon-btn" [class.active]="showGrid" (click)="toggleGrid()" title="Afficher la grille">
          <lucide-icon [img]="icons.grid" [size]="18"></lucide-icon>
        </button>
        <button class="icon-btn" [class.active]="snapEnabled" (click)="toggleSnap()" title="Magnétisme">
          <lucide-icon [img]="icons.snap" [size]="18"></lucide-icon>
        </button>
        <button class="icon-btn" [class.active]="showGuides" (click)="toggleGuides()" title="Repères">
          <lucide-icon [img]="icons.guides" [size]="18"></lucide-icon>
        </button>
      </div>

      <div class="zoom-control">
        <button class="icon-btn flat" (click)="zoomOut()">
          <lucide-icon [img]="icons.zoomOut" [size]="16"></lucide-icon>
        </button>
        <span class="zoom-value">{{ zoomPercent }}%</span>
        <button class="icon-btn flat" (click)="zoomIn()">
          <lucide-icon [img]="icons.zoomIn" [size]="16"></lucide-icon>
        </button>
      </div>

      <div class="paper-select">
        <select [(ngModel)]="paperFormat" (change)="onPaperFormatChange()">
          <option value="A4">A4 Portrait</option>
          <option value="A5">A5 Portrait</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
        </select>
      </div>
    </div>

    <div class="toolbar-right">
      <button class="secondary-btn" (click)="preview()">
        <lucide-icon [img]="icons.preview" [size]="16"></lucide-icon>
        Aperçu
      </button>
      <button class="secondary-btn" (click)="exportPdf()">
        <lucide-icon [img]="icons.export" [size]="16"></lucide-icon>
        Exporter
      </button>
      <button class="save-btn" title="Enregistrer" (click)="manualSave()">
        <lucide-icon [img]="icons.save" [size]="16"></lucide-icon>
      </button>
      <button class="primary-btn" (click)="publish()">
        <lucide-icon [img]="icons.publish" [size]="16"></lucide-icon>
        Publier
      </button>
      <button class="secondary-btn" (click)="toggleFillingMode()">
        <lucide-icon [img]="fillingMode ? icons.edit : icons.fileText" [size]="16"></lucide-icon>
        {{ fillingMode ? 'Éditer' : 'Remplir' }}
      </button>
    </div>
  </div>

  <div class="main-area">
    <div class="left-panel">
      <app-sidebar
        [blocks]="blocks"
        [templateId]="templateId"
        (explicitVariablesChange)="onExplicitVariablesChanged($event)"
        [selectedBlock]="selectedBlock"
        (blockSelected)="selectBlock($event)"
        (toggleVisibility)="onToggleVisibility($event)"
        (toggleLock)="onToggleLock($event)"
        (addBlock)="addBlock($event)">
      </app-sidebar>
    </div>

    <div class="canvas-container">
      <app-design-canvas
        [blocks]="blocks"
        [zoom]="zoomPercent"
        [canvasWidth]="canvasWidth"
        [canvasHeight]="canvasHeight"
        [showGrid]="showGrid"
        [snapEnabled]="snapEnabled"
        [showGuides]="showGuides"
        (blocksChange)="onCanvasBlocksChange($event)"
        (blockSelected)="selectBlock($event)">
      </app-design-canvas>
    </div>

    <div class="right-panel">
      <ng-container *ngIf="!fillingMode; else fillingPanel">
        <app-block-editor
          *ngIf="selectedBlock"
          [block]="selectedBlock"
          [allBlocks]="blocks"
          [explicitVariables]="explicitVariables"
          (updated)="updateBlock($event)"
          (closed)="selectedBlock = null">
        </app-block-editor>
        <app-block-preview [blocks]="blocks"></app-block-preview>
      </ng-container>
      <ng-template #fillingPanel>
        <app-template-filler [templateId]="templateId"></app-template-filler>
      </ng-template>
    </div>        
  </div>

  <div class="status-bar">
    <span class="status-item">
      <lucide-icon [img]="icons.Ruler" [size]="12"></lucide-icon>
      {{ paperFormat }}
    </span>
    <span class="status-sep">|</span>
    <span class="status-item">{{ statusDimensions }}</span>
    <span class="status-sep">|</span>
    <span class="status-item">{{ statusPosition }}</span>
    <span class="status-sep">|</span>
    <span class="status-item">Zoom {{ zoomPercent }}%</span>
    <span class="status-spacer"></span>
    <span class="status-item save-indicator" [class.saving]="savingStatus === 'saving'" [class.saved]="savingStatus === 'saved'">
      <lucide-icon [img]="savingStatus === 'saving' ? icons.loader : icons.check" [size]="12" [class.spin]="savingStatus === 'saving'"></lucide-icon>
      {{ savingStatus === 'saving' ? 'Enregistrement...' : 'Enregistré' }}
    </span>
  </div>
  
</div>
