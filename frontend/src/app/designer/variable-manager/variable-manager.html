<div class="variable-manager">
  <div class="panel-header">
    <lucide-icon [img]="icons.variable" [size]="15"></lucide-icon>
    <h4>Variables</h4>
  </div>

  <div *ngIf="loading" class="state-msg">Chargement...</div>
  <div *ngIf="error" class="state-msg error">{{ error }}</div>

  <!-- Liste -->
  <div class="var-list" *ngIf="variables.length > 0; else noVars">
    <div class="var-item" *ngFor="let v of variables" [class.editing]="editingVariableId === v.id" [class.calculated]="v.type === 'CALCULEE'">
      <div class="var-info">
        <div class="var-text">
          <span class="var-name">{{ v.nomVariable }}</span>
          <span class="var-type">{{ v.type }}</span>
        </div>
        <span class="required-dot" *ngIf="v.obligatoire" title="Obligatoire"></span>
      </div>
      <div class="var-actions">
        <button (click)="edit(v)" title="Modifier">
          <lucide-icon [img]="icons.edit" [size]="13"></lucide-icon>
        </button>
        <button (click)="delete(v)" title="Supprimer" class="danger">
          <lucide-icon [img]="icons.trash" [size]="13"></lucide-icon>
        </button>
      </div>
    </div>
  </div>
  <ng-template #noVars>
    <p class="no-vars">Aucune variable définie pour l'instant.</p>
  </ng-template>

  <!-- Formulaire -->
  <form [formGroup]="form" (ngSubmit)="save()" class="var-form">
    <div class="form-row">
      <label>Nom</label>
      <input type="text" formControlName="nomVariable" placeholder="ex: prix_total" />
      <div class="error" *ngIf="form.get('nomVariable')?.invalid && form.get('nomVariable')?.touched">
        Nom invalide (lettres, chiffres, _)
      </div>
    </div>

    <div class="form-row">
      <label>Type</label>
      <select formControlName="type">
        <option value="STRING">Texte</option>
        <option value="FLOAT">Nombre</option>
        <option value="DATE">Date</option>
        <option value="BOOLEAN">Oui/Non</option>
        <option value="ARRAY">Tableau</option>
        <option value="IMAGE">Image</option>
      </select>
    </div>

    <div class="form-row">
      <label>Description</label>
      <input type="text" formControlName="description" placeholder="Description (optionnel)" />
    </div>

    <div class="form-row checkbox">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="obligatoire" />
        <span class="toggle-slider"></span>
        Obligatoire
      </label>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" [disabled]="form.invalid">
        {{ editingVariableId ? 'Modifier' : 'Ajouter' }}
      </button>
      <button type="button" class="btn-secondary" *ngIf="editingVariableId" (click)="resetForm()">
        Annuler
      </button>
    </div>
  </form>
</div>
