<div class="preview-container">
  <div class="preview-header">
    <div class="header-left">
      <lucide-icon [img]="icons.preview" [size]="14"></lucide-icon>
      <span>Aperçu en temps réel ({{ safePreviewPages.length }} page{{ safePreviewPages.length > 1 ? 's' : '' }})</span>
    </div>
    <div class="zoom-controls">
      <button (click)="zoomOut()" [disabled]="zoom <= minZoom" title="Zoom arrière">
        <lucide-icon [img]="icons.minus" [size]="14"></lucide-icon>
      </button>
      <span class="zoom-value">{{ (zoom * 100).toFixed(0) }}%</span>
      <button (click)="zoomIn()" [disabled]="zoom >= maxZoom" title="Zoom avant">
        <lucide-icon [img]="icons.plus" [size]="14"></lucide-icon>
      </button>
      <button (click)="resetZoom()" title="Réinitialiser le zoom">
        <lucide-icon [img]="icons.reset" [size]="14"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="preview-content">
    <div class="preview-page-block" *ngFor="let p of safePreviewPages; let i = index">
      <div class="preview-page-label">{{ p.nom || 'Page ' + (i+1) }}</div>
      <div class="preview-sheet-wrapper">
        <div class="preview-sheet" [style.transform]="'scale(' + zoom + ')'" [style.transform-origin]="'top center'">
          <!-- Contenu de la page -->
          <div [innerHTML]="p.html"></div>
          <!-- Numéro de page en bas -->
          <div class="page-number">{{ i+1 }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
