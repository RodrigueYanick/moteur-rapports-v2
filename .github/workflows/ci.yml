# .github/workflows/ci.yml
name: CI/CD Pipeline - Moteur de Rapports

on:
  push:
    branches: [ main, master, Rodrigue ]
  pull_request:
    branches: [ main, master, Rodrigue ]

jobs:
  # ========================================================
  # JOB 1 : Backend (Spring Boot 3, Java 17, Maven Tests)
  # ========================================================
  backend-ci:
    name: Backend CI & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: moteur_rapports_test
          POSTGRES_USER: reportuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilation et Tests Maven
        working-directory: ./backend
        run: mvn clean verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/moteur_rapports_test
          SPRING_DATASOURCE_USERNAME: reportuser
          SPRING_DATASOURCE_PASSWORD: testpassword

      - name: Archivage du livrable JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: moteur-rapports-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ========================================================
  # JOB 2 : Frontend (Node.js 20, Angular 21 Build)
  # ========================================================
  frontend-ci:
    name: Frontend CI & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances npm
        working-directory: ./frontend
        run: npm ci

      - name: Compilation Angular en production
        working-directory: ./frontend
        run: npm run build

      - name: Archivage du bundle frontend
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: moteur-rapports-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ========================================================
  # JOB 3 : Tests E2E Playwright
  # ========================================================
  playwright-e2e:
    name: Tests End-to-End Playwright
    needs: [frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances npm
        working-directory: ./frontend
        run: npm ci

      - name: Installation des navigateurs Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Exécution des tests E2E Playwright
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Archivage du rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14