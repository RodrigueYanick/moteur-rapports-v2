# .github/workflows/ci.yml
name: CI - Build Backend & Frontend

on:
  push:
    branches: [ main, Morel, Rodrigue, Morino ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    name: Build & Test Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Configuration du JDK 17 Temurin et mise en cache des dépendances Maven
      - name: Configuration de Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Compilation du projet Spring Boot (avec wrapper mvnw s'il existe, sinon mvn)
      - name: Compiler le Backend Spring Boot
        working-directory: ./backend
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            ./mvnw clean compile
          else
            mvn clean compile
          fi

  build-frontend:
    name: Build Frontend (Angular 21 & Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Configuration de l'environnement Node.js 22
      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Installation propre des paquets npm du frontend
      - name: Installer les dépendances npm
        working-directory: ./frontend
        run: npm ci

      # Compilation de l'application Angular pour la production
      - name: Compiler l'application Angular
        working-directory: ./frontend
        run: npx ng build --configuration production