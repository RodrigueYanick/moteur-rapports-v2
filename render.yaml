services:
  # Backend Spring Boot (Web Service)
  - type: web
    name: moteur-rapports-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_DATASOURCE_URL
        sync: false # À renseigner avec l'URL PostgreSQL fournie par Neon.tech
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: PDF_ENGINE
        value: flying-saucer
      - key: STORAGE_PROVIDER
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=75.0"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false # Mettre l'URL du frontend Vercel ou Render

  # Frontend Angular (Static Site)
  - type: web
    name: moteur-rapports-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist/report-designer/browser
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://moteur-rapports-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
