version: '3.8'

services:
  postgres:
    image: postgres:15-alpine   # plus léger
    container_name: report-postgres
    environment:
      POSTGRES_DB: reportdb
      POSTGRES_USER: reportuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: