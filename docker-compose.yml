version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: report-postgres
    environment:
      POSTGRES_DB: moteur_rapports
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 20040
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: