spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5454/moteur_rapports_test}
    username: ${DB_USERNAME:reportuser}
    password: ${DB_PASSWORD:rodrigue}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

springdoc:
  api-docs:
    version: openapi_3_0
    path: /v3/api-docs
  swagger-ui:
    title: "Moteur de Rapports – Documentation API"
    path: /swagger-ui.html
    url: /v3/api-docs
    # --- Ergonomie ---
    display-request-duration: true      # affiche la durée de chaque requête
    operations-sorter: method           # tri par méthode HTTP (GET, POST, etc.)
    tags-sorter: alpha                  # tri alphabétique des tags
    doc-expansion: none                 # sections repliées par défaut (plus clair)
    filter: true                        # champ de recherche/filtre
    try-it-out-enabled: true            # permet de tester directement
    show-extensions: true               # montre les extensions OpenAPI
    show-common-extensions: true
    persist-authorization: true         # conserve les clés saisies entre les requêtes
    use-root-path: false
    display-operation-id: false
    default-model-rendering: example    # affiche l'exemple plutôt que le schéma brut
    show-request-headers: true          # montre les en-têtes de requête
    deep-linking: true                  # permet de partager un lien vers une opération précise
    # --- Apparence ---
    syntax-highlight:
      activated: true
      theme: monokai                   # thème de coloration (agréable)
    # --- CSS personnalisé (voir plus bas) ---
    custom-css: /swagger-ui.css

server:
  port: 8082

app:
  storage-path: ${STORAGE_PATH:./data/reports}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_PATH:./data/reports}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:rapports-pdf}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rendering:
    engine: ${PDF_ENGINE:gotenberg}
    gotenberg-endpoint: ${GOTENBERG_ENDPOINT:http://localhost:3000}
    timeout-seconds: ${PDF_TIMEOUT_SECONDS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: moteur-rapports


