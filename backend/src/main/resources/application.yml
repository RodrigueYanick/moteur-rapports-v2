spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moteur_rapports}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:20040}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  storage-path: ${STORAGE_PATH:./data/reports}
  jwt-secret: ${JWT_SECRET:changeme-dev}