spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5454/moteur_rapports}
    username: ${DB_USERNAME:reportuser}
    password: ${DB_PASSWORD:rodrigue}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082

app:
  storage-path: ${STORAGE_PATH:./data/reports}
